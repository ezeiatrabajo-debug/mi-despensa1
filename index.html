<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despensa">
<title>Mi Despensa</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface-hover: #252525;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text-secondary: #a0a0a0;
    --text-muted: #606060;
    --accent: #f59e0b;
    --accent-soft: rgba(245,158,11,0.12);
    --positive: #4ade80;
    --positive-soft: rgba(74,222,128,0.12);
    --warning: #fbbf24;
    --danger: #f87171;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  #app { height:100%; display:flex; flex-direction:column; }

  .header {
    padding: 16px 20px 8px;
    display:flex; justify-content:space-between; align-items:center;
    flex-shrink:0;
  }
  .header h1 { font-size:22px; font-weight:700; letter-spacing:-0.5px; }
  .header-actions { display:flex; gap:8px; }
  .icon-btn {
    width:40px; height:40px; border-radius:var(--radius-md);
    border:1px solid var(--border); background:var(--surface);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.15s;
  }
  .icon-btn:hover, .icon-btn:active { background:var(--surface-hover); transform:scale(0.95); }
  .icon-btn svg { width:20px; height:20px; }

  .screens { flex:1; overflow-y:auto; overflow-x:hidden; position:relative; }
  .screen {
    position:absolute; top:0; left:0; right:0; bottom:0;
    padding: 0 16px 100px; overflow-y:auto;
    opacity:0; pointer-events:none; transform:translateX(20px);
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  .screen.active { opacity:1; pointer-events:auto; transform:translateX(0); position:relative; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: all 0.15s;
  }
  .card:active { transform:scale(0.98); }

  .product-row { display:flex; justify-content:space-between; align-items:center; }
  .product-info { flex:1; min-width:0; }
  .product-name { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .product-meta { font-size:12px; color:var(--text-secondary); margin-top:3px; }
  .product-actions { display:flex; align-items:center; gap:6px; }
  .qty-btn {
    width:32px; height:32px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--bg);
    color:var(--text); font-size:16px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.1s; user-select:none;
  }
  .qty-btn:active { background:var(--surface-hover); transform:scale(0.9); }
  .qty-display { min-width:28px; text-align:center; font-weight:700; font-size:15px; }

  .stock-bar-wrap { margin-top:10px; }
  .stock-bar-labels { display:flex; justify-content:space-between; font-size:11px; color:var(--text-muted); margin-bottom:4px; }
  .stock-bar { height:6px; background:var(--bg); border-radius:3px; overflow:hidden; }
  .stock-fill { height:100%; border-radius:3px; transition:width 0.4s ease; }
  .stock-fill.high { background:var(--positive); }
  .stock-fill.medium { background:var(--warning); }
  .stock-fill.low { background:var(--danger); }

  .cat-header { display:flex; align-items:center; gap:8px; margin: 18px 0 10px; padding-left:4px; }
  .cat-dot { width:8px; height:8px; border-radius:50%; }
  .cat-dot.high { background:var(--positive); }
  .cat-dot.medium { background:var(--warning); }
  .cat-dot.low { background:var(--danger); }
  .cat-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); }

  .empty { text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-icon { font-size:48px; margin-bottom:12px; opacity:0.5; }

  .input-group { margin-bottom:14px; }
  .input-label { font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; display:block; }
  .input-field {
    width:100%; padding:12px 14px;
    background:var(--bg); border:1px solid var(--border);
    border-radius:var(--radius-md); color:var(--text);
    font-size:15px; outline:none; transition:border-color 0.2s;
  }
  .input-field:focus { border-color:var(--accent); }
  .input-field::placeholder { color:var(--text-muted); }

  .tags { display:flex; flex-wrap:wrap; gap:8px; }
  .tag {
    padding:7px 14px; border-radius:20px;
    border:1px solid var(--border); background:var(--bg);
    color:var(--text-secondary); font-size:13px; font-weight:500;
    cursor:pointer; transition:all 0.15s;
  }
  .tag.selected { background:var(--text); color:var(--bg); border-color:var(--text); }
  .tag:active { transform:scale(0.95); }

  .btn-primary {
    width:100%; padding:14px;
    background:var(--accent); color:var(--bg);
    border:none; border-radius:var(--radius-md);
    font-size:15px; font-weight:700; cursor:pointer;
    transition:all 0.15s; margin-top:8px;
  }
  .btn-primary:active { opacity:0.8; transform:scale(0.98); }
  .btn-secondary {
    width:100%; padding:14px;
    background:transparent; color:var(--text);
    border:1px solid var(--border); border-radius:var(--radius-md);
    font-size:15px; font-weight:600; cursor:pointer;
    transition:all 0.15s;
  }
  .btn-secondary:active { background:var(--surface-hover); }

  .check-item { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .check-item input[type="checkbox"] { width:22px; height:22px; accent-color:var(--text); cursor:pointer; flex-shrink:0; }
  .check-item span { font-size:15px; transition:all 0.2s; }
  .check-item.checked span { text-decoration:line-through; color:var(--text-muted); }

  .bottom-nav {
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; justify-content:space-around; padding:6px 0 20px;
    z-index:100; backdrop-filter:blur(20px);
  }
  .nav-item {
    flex:1; display:flex; flex-direction:column; align-items:center;
    gap:3px; padding:6px 0; background:none; border:none;
    color:var(--text-muted); cursor:pointer; transition:color 0.2s;
  }
  .nav-item.active { color:var(--accent); }
  .nav-item svg { width:22px; height:22px; }
  .nav-item span { font-size:10px; font-weight:600; }

  .toast {
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface); color:var(--text); padding:12px 20px;
    border-radius:var(--radius-md); border:1px solid var(--border);
    font-size:14px; font-weight:500; z-index:300;
    opacity:0; pointer-events:none; transition:all 0.3s;
    white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .modal-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.7); z-index:200;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.25s;
  }
  .modal-overlay.active { opacity:1; pointer-events:auto; }
  .modal-sheet {
    background:var(--surface); width:100%; max-width:480px;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    padding:20px 20px 30px; transform:translateY(100%);
    transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
    max-height:85vh; overflow-y:auto;
  }
  .modal-overlay.active .modal-sheet { transform:translateY(0); }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .modal-title { font-size:18px; font-weight:700; }

  .setting-row { display:flex; justify-content:space-between; align-items:center; }
  .setting-label { font-weight:500; font-size:15px; }
  .toggle {
    width:48px; height:26px; border-radius:13px;
    background:var(--bg); border:1px solid var(--border);
    position:relative; cursor:pointer; transition:all 0.2s;
  }
  .toggle.on { background:var(--positive); border-color:var(--positive); }
  .toggle::after {
    content:''; position:absolute; top:2px; left:2px;
    width:20px; height:20px; border-radius:50%;
    background:var(--text); transition:all 0.2s;
  }
  .toggle.on::after { left:24px; }

  .history-date { font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  .history-title { font-weight:600; font-size:15px; }
  .history-desc { font-size:13px; color:var(--text-secondary); margin-top:3px; }

  /* RECIPE STYLES */
  .search-bar { display:flex; gap:10px; padding: 0 0 12px; position:relative; }
  .search-input {
    flex:1; padding:12px 16px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); color:var(--text);
    font-size:15px; outline:none;
  }
  .search-input:focus { border-color:var(--accent); }
  .search-input::placeholder { color:var(--text-muted); }
  .search-btn {
    padding:12px 18px; background:var(--accent); color:var(--bg);
    border:none; border-radius:var(--radius-md); font-weight:700;
    cursor:pointer; transition:all 0.15s;
  }
  .search-btn:active { opacity:0.8; transform:scale(0.95); }
  .search-btn:disabled { opacity:0.4; cursor:not-allowed; }

  .recipe-card { display:flex; gap:14px; align-items:center; }
  .recipe-img {
    width:72px; height:72px; border-radius:var(--radius-sm);
    object-fit:cover; background:var(--bg); flex-shrink:0;
  }
  .recipe-info { flex:1; min-width:0; }
  .recipe-title { font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .recipe-meta { font-size:12px; color:var(--text-secondary); margin-top:4px; }
  .recipe-tags { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .recipe-tag {
    font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;
    padding:3px 8px; border-radius:4px; background:var(--accent-soft); color:var(--accent);
  }

  .section-title {
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
    color:var(--text-muted); margin: 18px 0 10px; padding-left:4px;
  }

  .ingredient-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 0; border-bottom:1px solid var(--border);
  }
  .ingredient-row:last-child { border-bottom:none; }
  .ingredient-name { font-weight:500; }
  .ingredient-qty { font-size:13px; color:var(--text-secondary); }

  .step-number {
    width:28px; height:28px; border-radius:50%;
    background:var(--accent); color:var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px; flex-shrink:0;
  }
  .step-card { display:flex; gap:12px; align-items:flex-start; margin-bottom:12px; }
  .step-text { font-size:14px; line-height:1.6; padding-top:4px; }

  .recipe-hero {
    width:100%; height:200px; object-fit:cover;
    border-radius:var(--radius-md); margin-bottom:16px;
    background:var(--surface);
  }
  .recipe-detail-title { font-size:20px; font-weight:700; margin-bottom:8px; }
  .recipe-detail-meta { font-size:13px; color:var(--text-secondary); margin-bottom:16px; }

  .loader { display:flex; justify-content:center; padding:40px; }
  .loader-spinner {
    width:32px; height:32px; border:3px solid var(--border);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .favorite-btn {
    position:absolute; top:12px; right:12px;
    width:36px; height:36px; border-radius:50%;
    background:rgba(0,0,0,0.6); border:none;
    color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:18px;
  }
  .favorite-btn.active { color:var(--danger); }

  .badge {
    display:inline-flex; align-items:center; gap:4px;
    font-size:11px; font-weight:600; color:var(--text-secondary);
    background:var(--bg); padding:4px 10px; border-radius:20px;
  }

  /* SUGGESTIONS DROPDOWN */
  .suggestions-dropdown {
    position:absolute; top:100%; left:0; right:0;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); margin-top:4px;
    max-height:240px; overflow-y:auto; z-index:50;
    display:none;
  }
  .suggestions-dropdown.active { display:block; }
  .suggestion-item {
    padding:10px 14px; cursor:pointer;
    border-bottom:1px solid var(--border);
    font-size:14px; display:flex; align-items:center; gap:8px;
  }
  .suggestion-item:last-child { border-bottom:none; }
  .suggestion-item:hover { background:var(--surface-hover); }
  .suggestion-item .sugg-icon { font-size:16px; }
  .suggestion-item .sugg-text { flex:1; }
  .suggestion-item .sugg-meta { font-size:11px; color:var(--text-muted); }

  /* FILTER CHIPS */
  .filter-chips {
    display:flex; gap:8px; overflow-x:auto; padding: 0 0 12px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .filter-chips::-webkit-scrollbar { display:none; }
  .filter-chip {
    padding:8px 16px; border-radius:20px;
    border:1px solid var(--border); background:var(--bg);
    color:var(--text-secondary); font-size:13px; font-weight:500;
    cursor:pointer; transition:all 0.15s; white-space:nowrap;
    flex-shrink:0;
  }
  .filter-chip.active {
    background:var(--accent); color:var(--bg); border-color:var(--accent);
  }
  .filter-chip:active { transform:scale(0.95); }

  /* CATEGORY GRID */
  .category-grid {
    display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;
  }
  .category-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:16px;
    text-align:center; cursor:pointer; transition:all 0.15s;
  }
  .category-card:active { transform:scale(0.97); }
  .category-card .cat-emoji { font-size:32px; margin-bottom:8px; }
  .category-card .cat-name { font-weight:600; font-size:14px; }
  .category-card .cat-count { font-size:12px; color:var(--text-muted); margin-top:2px; }

  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  @keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .animate-in { animation:fadeIn 0.3s ease; }

  @media(min-width:600px) {
    body { display:flex; justify-content:center; background:#000; }
    #app { width:100%; max-width:430px; border-left:1px solid var(--border); border-right:1px solid var(--border); }
    .bottom-nav { max-width:430px; left:50%; transform:translateX(-50%); }
    .modal-overlay { align-items:center; }
    .modal-sheet { border-radius:var(--radius-lg); transform:scale(0.9); opacity:0; }
    .modal-overlay.active .modal-sheet { transform:scale(1); opacity:1; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="toast" id="toast"></div>

  <div class="screens" id="screens">

    <!-- STOCK SCREEN -->
    <div class="screen active" id="screen-stock">
      <div class="header">
        <h1>Mi Despensa</h1>
        <div class="header-actions">
          <button class="icon-btn" onclick="openModalAddProduct()" title="Agregar producto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
      <div id="stock-content"></div>
    </div>

    <!-- LIST SCREEN -->
    <div class="screen" id="screen-list">
      <div class="header">
        <h1>Lista de Compras</h1>
        <div class="header-actions">
          <button class="icon-btn" onclick="openModalAddList()" title="Agregar a lista">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
      <div id="list-content"></div>
    </div>

    <!-- RECIPES SCREEN -->
    <div class="screen" id="screen-recipes">
      <div class="header">
        <h1>Recetas</h1>
      </div>
      <div class="search-bar" style="padding: 0 0 12px; position:relative;">
        <input class="search-input" id="recipe-search-input" placeholder="Buscar receta... (ej: pasta, pollo, tarta)" oninput="handleSearchInput(this)" onkeydown="if(event.key==='Enter'){hideSuggestions();searchRecipes();}">
        <button class="search-btn" id="recipe-search-btn" onclick="hideSuggestions();searchRecipes()">Buscar</button>
        <div class="suggestions-dropdown" id="suggestions-dropdown"></div>
      </div>
      <div id="recipes-content">
        <div class="section-title">Explorar por categoria</div>
        <div class="filter-chips" id="category-filters">
          <button class="filter-chip active" onclick="filterByCategory('all')">Todas</button>
          <button class="filter-chip" onclick="filterByCategory('Postre')">Postres</button>
          <button class="filter-chip" onclick="filterByCategory('Plato principal')">Platos</button>
          <button class="filter-chip" onclick="filterByCategory('Desayuno')">Desayuno</button>
          <button class="filter-chip" onclick="filterByCategory('Entrada')">Entradas</button>
          <button class="filter-chip" onclick="filterByCategory('Vegetariano')">Vegetariano</button>
        </div>
        <div class="section-title">Recetas Populares</div>
        <div id="popular-recipes"></div>
      </div>
    </div>

    <!-- RECIPE RESULTS -->
    <div class="screen" id="screen-recipe-results">
      <div class="header">
        <h1>Resultados</h1>
        <div class="header-actions">
          <button class="icon-btn" onclick="showScreen('recipes')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div id="recipe-results-content"></div>
    </div>

    <!-- RECIPE DETAIL -->
    <div class="screen" id="screen-recipe-detail">
      <div class="header">
        <h1>Receta</h1>
        <div class="header-actions">
          <button class="icon-btn" onclick="showScreen('recipe-results')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
        </div>
      </div>
      <div id="recipe-detail-content"></div>
    </div>

    <!-- HISTORY SCREEN -->
    <div class="screen" id="screen-history">
      <div class="header"><h1>Historial</h1></div>
      <div id="history-content"></div>
    </div>

    <!-- SETTINGS SCREEN -->
    <div class="screen" id="screen-settings">
      <div class="header"><h1>Ajustes</h1></div>
      <div class="card" style="cursor:pointer;" onclick="toggleSetting(this)">
        <div class="setting-row">
          <span class="setting-label">Notificaciones de stock bajo</span>
          <div class="toggle on" data-setting="notifications"></div>
        </div>
      </div>
      <div class="card" style="cursor:pointer;" onclick="toggleSetting(this)">
        <div class="setting-row">
          <span class="setting-label">Umbral de alerta</span>
          <span style="font-weight:700;" id="threshold-display">20%</span>
        </div>
      </div>
      <div class="card" style="cursor:pointer;" onclick="toggleSetting(this)">
        <div class="setting-row">
          <span class="setting-label">Borrar todos los datos</span>
          <span style="color:var(--danger); font-size:13px; font-weight:600;">Restaurar</span>
        </div>
      </div>
      <div style="text-align:center; margin-top:40px; color:var(--text-muted); font-size:12px;">
        Mi Despensa v2.1
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showScreen('stock')" data-screen="stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Stock</span>
    </button>
    <button class="nav-item" onclick="showScreen('list')" data-screen="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Lista</span>

}

// ===================== NAVEGACIÓN =====================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const target = document.getElementById('screen-' + name);
  if (target) target.classList.add('active');
  const nav = document.querySelector(`.nav-item[data-screen="${name}"]`);
  if (nav) nav.classList.add('active');
  if (name === 'stock') renderStock();
  if (name === 'list') renderList();
  if (name === 'history') renderHistory();
  if (name === 'recipes') { renderPopularRecipes(); document.getElementById('recipe-search-input').value = ''; hideSuggestions(); }
  window.scrollTo(0, 0);
}

// ===================== STOCK =====================
function renderStock() {
  const container = document.getElementById('stock-content');
  const cats = {};
  state.products.forEach(p => {
    if (!cats[p.cat]) cats[p.cat] = [];
    cats[p.cat].push(p);
  });
  const catOrder = ['almacen','lacteos','verduras','carnes','bebidas','limpieza','otros'];
  const catNames = { almacen:'Almacén', lacteos:'Lácteos', verduras:'Verduras', carnes:'Carnes', bebidas:'Bebidas', limpieza:'Limpieza', otros:'Otros' };
  let html = '';
  catOrder.forEach(cat => {
    if (!cats[cat]) return;
    const items = cats[cat].sort((a,b) => a.name.localeCompare(b.name));
    const lowCount = items.filter(p => (p.qty/p.max)*100 <= state.settings.threshold).length;
    const dotClass = lowCount > 0 ? 'low' : (items.some(p => (p.qty/p.max)*100 <= 50) ? 'medium' : 'high');
    html += `<div class="cat-header"><div class="cat-dot ${dotClass}"></div><span class="cat-title">${catNames[cat]}</span></div>`;
    items.forEach(p => {
      const pct = Math.min(100, Math.round((p.qty / p.max) * 100));
      const barClass = pct <= state.settings.threshold ? 'low' : (pct <= 50 ? 'medium' : 'high');
      html += `
        <div class="card animate-in">
          <div class="product-row">
            <div class="product-info">
              <div class="product-name">${escapeHtml(p.name)}</div>
              <div class="product-meta">${p.qty} ${p.unit} · máx ${p.max}</div>
            </div>
            <div class="product-actions">
              <button class="qty-btn" onclick="changeQty('${p.id}', -1)">−</button>
              <span class="qty-display">${p.qty}</span>
              <button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button>
            </div>
          </div>
          <div class="stock-bar-wrap">
            <div class="stock-bar-labels"><span>${pct}%</span><span>${p.max} ${p.unit}</span></div>
            <div class="stock-bar"><div class="stock-fill ${barClass}" style="width:${pct}%"></div></div>
          </div>
        </div>`;
    });
  });
  if (!state.products.length) {
    html = `<div class="empty"><div class="empty-icon">📦</div><div>No hay productos en stock</div><div style="font-size:13px;margin-top:8px;">Tocá el + para agregar uno</div></div>`;
  }
  container.innerHTML = html;
}

function changeQty(id, delta) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  p.qty = Math.max(0, p.qty + delta);
  if (p.qty === 0) {
    addHistory(`Stock agotado`, `${p.name}: 0 ${p.unit}`);
    showToast(`${p.name} se agotó`);
  }
  saveState();
  renderStock();
}

function openModalAddProduct() {
  document.getElementById('prod-name').value = '';
  document.getElementById('prod-qty').value = '';
  document.getElementById('prod-unit').value = '';
  document.getElementById('prod-max').value = '10';
  document.querySelectorAll('#prod-cats .tag').forEach(t => t.classList.remove('selected'));
  document.querySelector('#prod-cats .tag[data-cat="almacen"]').classList.add('selected');
  openModal('modal-add-product');
}

function saveProduct() {
  const name = document.getElementById('prod-name').value.trim();
  const qty = parseInt(document.getElementById('prod-qty').value) || 1;
  const unit = document.getElementById('prod-unit').value.trim() || 'unid';
  const max = parseInt(document.getElementById('prod-max').value) || 10;
  const catEl = document.querySelector('#prod-cats .tag.selected');
  const cat = catEl ? catEl.dataset.cat : 'otros';
  if (!name) { showToast('Ingresá un nombre'); return; }
  const id = 'p' + Date.now();
  state.products.push({ id, name, qty, max, unit, cat });
  addHistory('Producto agregado', `${name}: ${qty} ${unit}`);
  saveState();
  closeModal('modal-add-product');
  renderStock();
  showToast(`${name} agregado al stock`);
}

// ===================== LISTA DE COMPRAS =====================
function renderList() {
  const container = document.getElementById('list-content');
  const pending = state.list.filter(i => !i.done);
  const done = state.list.filter(i => i.done);
  let html = '';
  if (pending.length) {
    html += `<div class="cat-header"><div class="cat-dot high"></div><span class="cat-title">Pendientes</span></div>`;
    pending.forEach(item => {
      const prioColor = item.prio === 'urgente' ? 'color:var(--danger)' : (item.prio === 'opcional' ? 'color:var(--text-muted)' : '');
      html += `
        <div class="card animate-in">
          <div class="check-item" onclick="toggleListItem('${item.id}')">
            <input type="checkbox" ${item.done ? 'checked' : ''} onclick="event.stopPropagation();toggleListItem('${item.id}')">
            <span>${escapeHtml(item.name)} <span style="font-size:12px;color:var(--text-muted)">· ${item.qty} ${item.unit}</span></span>
          </div>
          <div style="text-align:right;margin-top:6px;font-size:11px;text-transform:uppercase;font-weight:700;${prioColor}">${item.prio}</div>
        </div>`;
    });
  }
  if (done.length) {
    html += `<div class="cat-header"><div class="cat-dot medium"></div><span class="cat-title">Comprados</span></div>`;
    done.forEach(item => {
      html += `
        <div class="card animate-in" style="opacity:0.6">
          <div class="check-item checked" onclick="toggleListItem('${item.id}')">
            <input type="checkbox" checked onclick="event.stopPropagation();toggleListItem('${item.id}')">
            <span>${escapeHtml(item.name)} <span style="font-size:12px">· ${item.qty} ${item.unit}</span></span>
          </div>
        </div>`;
    });
  }
  if (!state.list.length) {
    html = `<div class="empty"><div class="empty-icon">🛒</div><div>Tu lista está vacía</div><div style="font-size:13px;margin-top:8px;">Agregá lo que necesitás comprar</div></div>`;
  }
  container.innerHTML = html;
}

function toggleListItem(id) {
  const item = state.list.find(x => x.id === id);
  if (!item) return;
  item.done = !item.done;
  if (item.done) addHistory('Compra realizada', `${item.name}: ${item.qty} ${item.unit}`);
  saveState();
  renderList();
}

function openModalAddList() {
  document.getElementById('list-name').value = '';
  document.getElementById('list-qty').value = '';
  document.getElementById('list-unit').value = '';
  document.querySelectorAll('#list-priority .tag').forEach(t => t.classList.remove('selected'));
  document.querySelector('#list-priority .tag[data-prio="normal"]').classList.add('selected');
  openModal('modal-add-list');
}

function saveListItem() {
  const name = document.getElementById('list-name').value.trim();
  const qty = parseInt(document.getElementById('list-qty').value) || 1;
  const unit = document.getElementById('list-unit').value.trim() || 'unid';
  const prioEl = document.querySelector('#list-priority .tag.selected');
  const prio = prioEl ? prioEl.dataset.prio : 'normal';
  if (!name) { showToast('Ingresá un producto'); return; }
  const id = 'l' + Date.now();
  state.list.push({ id, name, qty, unit, prio, done: false });
  saveState();
  closeModal('modal-add-list');
  renderList();
  showToast(`${name} agregado a la lista`);
}

// ===================== HISTORIAL =====================
function renderHistory() {
  const container = document.getElementById('history-content');
  if (!state.history.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">📜</div><div>Sin actividad reciente</div></div>`;
    return;
  }
  const grouped = {};
  state.history.slice().reverse().forEach(h => {
    const d = new Date(h.date);
    const key = d.toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(h);
  });
  let html = '';
  Object.entries(grouped).forEach(([date, items]) => {
    html += `<div class="cat-header"><span class="cat-title">${date}</span></div>`;
    items.forEach(h => {
      html += `
        <div class="card animate-in">
          <div class="history-title">${escapeHtml(h.title)}</div>
          <div class="history-desc">${escapeHtml(h.desc)}</div>
        </div>`;
    });
  });
  container.innerHTML = html;
}

function addHistory(title, desc) {
  state.history.push({ id: 'h' + Date.now(), date: new Date().toISOString(), title, desc });
  if (state.history.length > 100) state.history = state.history.slice(-100);
  saveState();
}

// ===================== RECETAS =====================
let currentCategory = 'all';
let currentSearch = '';

function renderPopularRecipes() {
  const container = document.getElementById('popular-recipes');
  let recipes = RECIPES;
  if (currentCategory !== 'all') {
    recipes = recipes.filter(r => r.categories.includes(currentCategory));
  }
  let html = '';
  recipes.forEach(r => {
    const isFav = state.favorites.includes(r.id);
    html += `
      <div class="card recipe-card animate-in" onclick="showRecipeDetail('${r.id}')" style="cursor:pointer;position:relative;">
        <img class="recipe-img" src="${r.image}" alt="${escapeHtml(r.title)}" loading="lazy">
        <div class="recipe-info">
          <div class="recipe-title">${escapeHtml(r.title)}</div>
          <div class="recipe-meta">⏱ ${r.time} · 🍽 ${r.servings} porciones · ${r.difficulty}</div>
          <div class="recipe-tags">
            ${r.categories.map(c => `<span class="recipe-tag">${c}</span>`).join('')}
          </div>
        </div>
        <button class="favorite-btn ${isFav?'active':''}" onclick="event.stopPropagation();toggleFavorite('${r.id}')" title="Favorito">
          ${isFav ? '❤' : '🤍'}
        </button>
      </div>`;
  });
  if (!recipes.length) {
    html = `<div class="empty"><div class="empty-icon">🍳</div><div>No se encontraron recetas</div></div>`;
  }
  container.innerHTML = html;
}

function filterByCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('#category-filters .filter-chip').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  renderPopularRecipes();
}

function toggleFavorite(id) {
  const idx = state.favorites.indexOf(id);
  if (idx > -1) state.favorites.splice(idx, 1);
  else state.favorites.push(id);
  saveState();
  renderPopularRecipes();
  const rec = RECIPES.find(r => r.id === id);
  showToast(idx > -1 ? `${rec.title} eliminado de favoritos` : `${rec.title} agregado a favoritos`);
}

// ===================== BÚSQUEDA Y SUGERENCIAS =====================
function handleSearchInput(input) {
  const val = input.value.trim().toLowerCase();
  currentSearch = val;
  const dropdown = document.getElementById('suggestions-dropdown');
  if (!val) { dropdown.classList.remove('active'); return; }

  const matches = SUGGESTIONS_DB.filter(s => s.text.toLowerCase().includes(val)).slice(0, 8);
  if (!matches.length) { dropdown.classList.remove('active'); return; }

  const icons = { receta: '🍽', ingrediente: '🥕', categoria: '📂' };
  dropdown.innerHTML = matches.map(m => `
    <div class="suggestion-item" onclick="selectSuggestion('${escapeHtml(m.text)}')">
      <span class="sugg-icon">${icons[m.type]}</span>
      <span class="sugg-text">${highlightMatch(escapeHtml(m.text), val)}</span>
      <span class="sugg-meta">${m.meta}</span>
    </div>
  `).join('');
  dropdown.classList.add('active');
}

function highlightMatch(text, query) {
  const re = new RegExp(`(${query})`, 'gi');
  return text.replace(re, '<b style="color:var(--accent)">$1</b>');
}

function selectSuggestion(text) {
  document.getElementById('recipe-search-input').value = text;
  hideSuggestions();
  searchRecipes();
}

function hideSuggestions() {
  document.getElementById('suggestions-dropdown').classList.remove('active');
}

function searchRecipes() {
  const query = document.getElementById('recipe-search-input').value.trim().toLowerCase();
  if (!query) { showToast('Ingresá un término de búsqueda'); return; }

  const results = RECIPES.filter(r => {
    const inTitle = r.title.toLowerCase().includes(query);
    const inCat = r.categories.some(c => c.toLowerCase().includes(query));
    const inIng = r.ingredients.some(i => i.name.toLowerCase().includes(query));
    return inTitle || inCat || inIng;
  });

  renderRecipeResults(results, query);
  showScreen('recipe-results');
  addHistory('Búsqueda de receta', `Buscó: "${query}" (${results.length} resultado${results.length!==1?'s':''})`);
}

function renderRecipeResults(results, query) {
  const container = document.getElementById('recipe-results-content');
  let html = `<div style="margin-bottom:12px;font-size:13px;color:var(--text-secondary)">${results.length} resultado${results.length!==1?'s':''} para "${escapeHtml(query)}"</div>`;

  if (!results.length) {
    html += `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <div>No encontramos recetas para "${escapeHtml(query)}"</div>
        <div style="font-size:13px;margin-top:8px;">Probá con otro ingrediente o categoría</div>
        <div style="margin-top:16px;">
          <div class="section-title">Sugerencias</div>
          <div class="tags">
            <button class="tag" onclick="document.getElementById('recipe-search-input').value='pollo';searchRecipes()">Pollo</button>
            <button class="tag" onclick="document.getElementById('recipe-search-input').value='pasta';searchRecipes()">Pasta</button>
            <button class="tag" onclick="document.getElementById('recipe-search-input').value='postre';searchRecipes()">Postre</button>
            <button class="tag" onclick="document.getElementById('recipe-search-input').value='vegetariano';searchRecipes()">Vegetariano</button>
          </div>
        </div>
      </div>`;
  } else {
    results.forEach(r => {
      const isFav = state.favorites.includes(r.id);
      html += `
        <div class="card recipe-card animate-in" onclick="showRecipeDetail('${r.id}')" style="cursor:pointer;position:relative;">
          <img class="recipe-img" src="${r.image}" alt="${escapeHtml(r.title)}" loading="lazy">
          <div class="recipe-info">
            <div class="recipe-title">${escapeHtml(r.title)}</div>
            <div class="recipe-meta">⏱ ${r.time} · 🍽 ${r.servings} porciones · ${r.difficulty}</div>
            <div class="recipe-tags">
              ${r.categories.map(c => `<span class="recipe-tag">${c}</span>`).join('')}
            </div>
          </div>
          <button class="favorite-btn ${isFav?'active':''}" onclick="event.stopPropagation();toggleFavorite('${r.id}')">
            ${isFav ? '❤' : '🤍'}
          </button>
        </div>`;
    });
  }
  container.innerHTML = html;
}

// ===================== DETALLE DE RECETA =====================
function showRecipeDetail(id) {
  const r = RECIPES.find(x => x.id === id);
  if (!r) return;
  const container = document.getElementById('recipe-detail-content');
  const isFav = state.favorites.includes(id);

  // Verificar qué ingredientes tenemos en stock
  const stockNames = state.products.map(p => p.name.toLowerCase());

  container.innerHTML = `
    <div class="animate-in">
      <div style="position:relative;">
        <img class="recipe-hero" src="${r.image}" alt="${escapeHtml(r.title)}">
        <button class="favorite-btn ${isFav?'active':''}" style="top:8px;right:8px;" onclick="toggleFavorite('${r.id}');showRecipeDetail('${r.id}')">
          ${isFav ? '❤' : '🤍'}
        </button>
      </div>
      <div class="recipe-detail-title">${escapeHtml(r.title)}</div>
      <div class="recipe-detail-meta">
        <span class="badge">⏱ ${r.time}</span>
        <span class="badge">🍽 ${r.servings} porciones</span>
        <span class="badge">📊 ${r.difficulty}</span>
      </div>
      <div class="recipe-tags" style="margin-bottom:16px;">
        ${r.categories.map(c => `<span class="recipe-tag">${c}</span>`).join('')}
      </div>

      <div class="section-title">Ingredientes</div>
      <div class="card" style="padding:0 16px;">
        ${r.ingredients.map(ing => {
          const hasInStock = stockNames.some(s => ing.name.toLowerCase().includes(s) || s.includes(ing.name.toLowerCase()));
          const stockIcon = hasInStock ? '✅' : '⚪';
          return `
            <div class="ingredient-row">
              <span class="ingredient-name">${stockIcon} ${escapeHtml(ing.name)}</span>
              <span class="ingredient-qty">${ing.qty} ${ing.unit}</span>
            </div>`;
        }).join('')}
      </div>

      <div style="margin:14px 0;">
        <button class="btn-secondary" onclick="addRecipeToList('${r.id}')">➕ Agregar ingredientes faltantes a la lista</button>
      </div>

      <div class="section-title">Preparación</div>
      ${r.steps.map((step, i) => `
        <div class="step-card">
          <div class="step-number">${i+1}</div>
          <div class="step-text">${escapeHtml(step)}</div>
        </div>
      `).join('')}

      <div style="height:40px;"></div>
    </div>
  `;
  showScreen('recipe-detail');
}

function addRecipeToList(recipeId) {
  const r = RECIPES.find(x => x.id === recipeId);
  if (!r) return;
  const stockNames = state.products.map(p => p.name.toLowerCase());
  let added = 0;
  r.ingredients.forEach(ing => {
    const hasInStock = stockNames.some(s => ing.name.toLowerCase().includes(s) || s.includes(ing.name.toLowerCase()));
    if (!hasInStock) {
      const id = 'l' + Date.now() + Math.random().toString(36).substr(2,5);
      state.list.push({ id, name: ing.name, qty: ing.qty, unit: ing.unit, prio: 'normal', done: false });
      added++;
    }
  });
  saveState();
  if (added > 0) {
    showToast(`${added} ingrediente${added>1?'s':''} agregado${added>1?'s':''} a la lista de compras`);
    addHistory('Lista desde receta', `De "${r.title}": ${added} items`);
  } else {
    showToast('¡Tenés todos los ingredientes en stock!');
  }
}

// ===================== AJUSTES =====================
function toggleSetting(card) {
  const toggle = card.querySelector('.toggle');
  const label = card.querySelector('.setting-label').textContent;
  if (toggle) {
    toggle.classList.toggle('on');
    state.settings.notifications = toggle.classList.contains('on');
    saveState();
    showToast(toggle.classList.contains('on') ? 'Notificaciones activadas' : 'Notificaciones desactivadas');
  } else if (label.includes('Umbral')) {
    const current = state.settings.threshold;
    const next = current === 20 ? 30 : (current === 30 ? 50 : 20);
    state.settings.threshold = next;
    document.getElementById('threshold-display').textContent = next + '%';
    saveState();
    showToast(`Umbral de alerta: ${next}%`);
  } else if (label.includes('Borrar')) {
    if (confirm('¿Estás seguro de borrar todos los datos? Esta acción no se puede deshacer.')) {
      localStorage.removeItem(STORAGE_KEY);
      state = { products: [], list: [], history: [], favorites: [], settings: { notifications: true, threshold: 20 } };
      seedDemoData();
      renderAll();
      showToast('Datos restaurados');
    }
  }
}

// ===================== UTILIDADES =====================
function selectTag(btn) {
  const parent = btn.parentElement;
  parent.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
  btn.classList.add('selected');
}

function openModal(id) {
  document.getElementById(id).classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function closeModalOnOverlay(e) {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('active');
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Cerrar sugerencias al hacer click fuera
document.addEventListener('click', (e) => {
  const searchBar = document.querySelector('.search-bar');
  if (searchBar && !searchBar.contains(e.target)) {
    hideSuggestions();
  }
});

// Inicializar
loadState();
</script>
